# Stage 1 demo stack: agent + Ops Console + Postgres (one image, two commands).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent   # local-only demo database, not exposed outside the compose network
      POSTGRES_DB: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      retries: 10

  agent:
    build: .
    env_file: .env
    environment:
      AGENT_DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/agent
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  console:
    build: .
    command: ["pipeline-agent", "console"]
    env_file: .env
    environment:
      AGENT_DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/agent
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8080:8080"   # localhost only
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
