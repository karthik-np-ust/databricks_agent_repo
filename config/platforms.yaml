# Platform instances the agent monitors. One plugin can have many instances.
# Secrets are references only (env://NAME now, kv://name from the Stage 2 pilot).
platforms:
  # Local demo without any credentials. Runs progress in real time and persist
  # in .sim_state.json between `pipeline-agent once` calls.
  - id: sim-demo
    plugin: simulator
    enabled: true
    config:
      state_file: .sim_state.json
      repo: karthik-np-ust/databricks_agent_repo
      pipelines:
        - { name: orders_pipeline,     behaviour: fail_code,      duration_seconds: 45, code_path: sample_pipelines/src }
        - { name: sales_report,        behaviour: slow,           slow_duration_seconds: 1800 }
        - { name: partner_feed_ingest, behaviour: fail_transient, fail_attempts: 1, duration_seconds: 20 }
        - { name: customer_export,     behaviour: fail_permission, duration_seconds: 20 }
        - { name: daily_kpis,          behaviour: ok,             duration_seconds: 30, env: dev }

  # Databricks Free Edition. Phase 0 passed on 2026-10-25 (see docs/04-scope-and-status.md).
  - id: dbx-free
    plugin: databricks
    enabled: true
    config:
      include: ["orders_pipeline", "sales_report", "partner_feed_ingest"]
      env_prefixes: { "[dev] ": dev, "[qa] ": qa }
      use_billing_table: true   # Phase 0: system.billing.usage is readable on this workspace
      estimated_dbu_per_hour: 1.0
      dbu_rate_usd: 0.0         # Free Edition is free; set your contract rate on a paid workspace
      repo: karthik-np-ust/databricks_agent_repo
      code_root: sample_pipelines
    secrets:
      token: env://DATABRICKS_TOKEN
      host: env://DATABRICKS_HOST
      warehouse_id: env://DATABRICKS_WAREHOUSE_ID
