# Model routing. Model IDs change often on OpenRouter: check
# `python scripts/phase0_checks.py` (lists free models with tool support).
llm:
  triage_models:
    - nvidia/nemotron-3.5-super-vl:free
    - recursive/flint-v1.0:free
  # Code generation. Free coding-oriented models with tool support (2026-10-26).
  # A stronger paid coding model is recommended for anything beyond the demo.
  fix_models:
    - poolside/laguna-s-2.1:free
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - cohere/north-mini-code:free
  max_tokens: 4000            # free "reasoning" models think before answering; 1500 truncated them
  fix_max_tokens: 12000       # whole-file rewrites need room
  temperature: 0.1
  max_context_chars: 12000
