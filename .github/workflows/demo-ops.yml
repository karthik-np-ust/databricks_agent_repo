# Demo operations that upload to Databricks. Run from GitHub's runners because
# the corporate proxy blocks uploads from UST laptops (docs/05-environment-restrictions.md).
#   setup  : catalogs, schemas, landing volumes, secret scopes, clean data (all envs)
#   inject : data/runtime/env fault scenarios (release faults are git commits, run locally)
#   reset  : clean data, secrets restored, silver/gold dropped (all envs)
name: demo-ops

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [setup, inject, reset]
        default: setup
      scenario:
        description: "inject only"
        type: choice
        options: [bad_cast, zero_units, duplicate_keys, schema_drift, null_keys, prompt_injection,
                  slow_report, flaky_partner, missing_secret, secret_in_logs]
        default: bad_cast
      env:
        description: "inject only: environment to break"
        type: choice
        options: [prod, qa, dev]
        default: prod
      layout:
        type: choice
        options: [catalog, schema]
        default: catalog

permissions:
  contents: read

concurrency:
  group: demo-ops   # one demo operation at a time
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install databricks-sdk pyyaml
      - name: setup
        if: inputs.action == 'setup'
        run: python scripts/setup_workspace.py --layout ${{ inputs.layout }}
      - name: inject
        if: inputs.action == 'inject'
        run: python scripts/inject_fault.py ${{ inputs.scenario }} --env ${{ inputs.env }} --layout ${{ inputs.layout }}
      - name: reset
        if: inputs.action == 'reset'
        run: python scripts/reset_demo.py --layout ${{ inputs.layout }}
