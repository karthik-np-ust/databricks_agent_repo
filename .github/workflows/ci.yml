# PR checks for the agent repo. Pipeline code (and its promotion-path / path-guard
# checks) lives in the separate pipelines repo (orders-pipelines).
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" -e plugins/agent-plugin-simulator -e plugins/agent-plugin-databricks
      - run: pytest

  console-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build   # tsc type-check + production bundle
        working-directory: frontend
