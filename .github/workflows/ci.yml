# PR checks for every branch in the promotion path (fix/* -> dev -> qa -> main).
name: ci

on:
  pull_request:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" -e plugins/agent-plugin-simulator -e plugins/agent-plugin-databricks
      - run: pytest

  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -r sample_pipelines/requirements-dev.txt
      - run: pytest sample_pipelines/tests -rs

  # Pipeline code must follow dev -> qa -> main. Learned 2026-10-26: a manual dev -> main
  # merge shipped an agent fix that had just failed its dev smoke run.
  # (Agent/console code PRs from feature branches to main are not affected.)
  promotion-path:
    if: github.base_ref == 'qa' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pipeline changes must come from the previous environment
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- sample_pipelines/ | head -50)
          if [ -z "$changed" ]; then echo "No pipeline code changes"; exit 0; fi
          case "${{ github.base_ref }}" in main) need=qa ;; qa) need=dev ;; esac
          if [ "${{ github.head_ref }}" != "$need" ]; then
            echo "::error::Pipeline code into ${{ github.base_ref }} must come from '$need' (this PR is from '${{ github.head_ref }}'). Changed: $(echo $changed | tr '\n' ' ')"
            exit 1
          fi
          echo "OK: ${{ github.head_ref }} -> ${{ github.base_ref }}"

  console-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build   # tsc type-check + production bundle
        working-directory: frontend

  # The agent's PRs may only touch pipeline code and tests. Anything else
  # (workflows, config, CODEOWNERS) fails here, whatever the PR text says.
  path-guard:
    if: github.event.pull_request.user.login == vars.AGENT_BOT_LOGIN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check changed paths
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          bad=$(echo "$changed" | grep -Ev '^sample_pipelines/(src|tests)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Agent PR touches files outside sample_pipelines/src and sample_pipelines/tests:"
            echo "$bad"
            exit 1
          fi

  bundle-validate:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle for the target branch
        working-directory: sample_pipelines
        run: |
          if [ -z "$DATABRICKS_TOKEN" ]; then echo "No Databricks secrets (fork PR?): skipping"; exit 0; fi
          case "${{ github.base_ref }}" in main) target=prod ;; *) target="${{ github.base_ref }}" ;; esac
          databricks bundle validate -t "$target"
