# Branch -> environment deploys into the single Free Edition workspace.
#   dev  -> bundle target dev  ([dev] jobs, dev catalog), then a smoke run
#   qa   -> bundle target qa   ([qa] jobs, qa catalog),  then a smoke run
#   main -> bundle target prod (scheduled jobs, prod catalog). The `prod`
#           GitHub Environment should require a reviewer (second human gate).
name: deploy

on:
  push:
    branches: [dev, qa, main]
    paths: ["sample_pipelines/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One deploy/smoke run at a time across all environments: keeps us inside
# Free Edition's 5 concurrent tasks.
concurrency:
  group: databricks-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      TARGET: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate and deploy bundle
        working-directory: sample_pipelines
        run: |
          set -o pipefail
          databricks bundle validate -t "$TARGET" 2>&1 | tee -a "$RUNNER_TEMP/bundle.log"
          databricks bundle deploy -t "$TARGET" 2>&1 | tee -a "$RUNNER_TEMP/bundle.log"
      - name: Smoke run (dev/qa only; prod runs on schedule or via the agent)
        if: env.TARGET != 'prod'
        working-directory: sample_pipelines
        run: |
          set -o pipefail
          databricks bundle run -t "$TARGET" orders_pipeline 2>&1 | tee -a "$RUNNER_TEMP/bundle.log"
      # Job logs need a signed-in GitHub user; annotations are visible to anyone
      # (and to the agent's tooling), so publish the tail of the output on failure.
      - name: Publish failure output as annotation
        if: failure()
        run: |
          msg=$(tail -n 40 "$RUNNER_TEMP/bundle.log" 2>/dev/null | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=bundle ${TARGET}::${msg:-no output captured}"
